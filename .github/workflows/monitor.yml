name: gakushukan-monitor

on:
  schedule:
    # 日本時間7:02～22:57、5分間隔。毎時0分を避けて起動する。
    - cron: "2-59/5 0-13,22,23 * * *"
    # 受付開始前に環境を準備。待機中は予約サイトにアクセスしない。
    - cron: "40 14 * * *"
    - cron: "2-17/5 15 * * *"
    - cron: "2,7,12 20 25 * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知をDiscordへ送る（通常はオフ）"
        type: boolean
        default: false
      reset_state:
        description: "通知せず現在の空きを基準として再登録（testとは併用不可）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '40 14 * * *' && 45 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install browser
        run: playwright install --with-deps chromium

      # Secret は環境変数で渡す。config*.yaml を編集すると git pull --rebase が失敗する。
      - name: Run monitor
        id: monitor
        timeout-minutes: ${{ github.event.schedule == '40 14 * * *' && 35 || 10 }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test }}
          RESET_STATE: ${{ inputs.reset_state }}
          OPENING_WATCH: ${{ github.event.schedule == '40 14 * * *' }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ] && [ "$RESET_STATE" = "true" ]; then
            echo "test と reset_state は併用できません" >&2
            exit 1
          elif [ "$TEST_NOTIFICATION" = "true" ]; then
            python -u monitor.py --config config.yaml --test
          elif [ "$RESET_STATE" = "true" ]; then
            python -u monitor.py --config config.yaml --reset-state
          elif [ "$OPENING_WATCH" = "true" ]; then
            python -u monitor.py --config config.yaml --opening-watch
          else
            python -u monitor.py --config config.yaml
          fi

      # 途中まで送信して後続で失敗した場合も、送信済みのチェックポイントを保存する。
      - name: Persist state
        if: ${{ always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') && inputs.test != true }}
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: bash scripts/persist_state.sh state.json "$STATE_BRANCH"

      - name: Upload state backup and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-and-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state.json
            debug/
          if-no-files-found: ignore
          retention-days: 14
