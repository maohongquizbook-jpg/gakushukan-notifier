name: fureai-monitor

on:
  schedule:
    - cron: "15,45 0-13,22,23 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知をDiscordへ送る（通常はオフ）"
        type: boolean
        default: false
      reset_state:
        description: "通知せず現在の空きを基準として再登録（testとは併用不可）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fureai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install browser
        run: playwright install --with-deps chromium

      # Secret は環境変数で渡す。config*.yaml を編集すると git pull --rebase が失敗する。
      - name: Run monitor
        id: monitor
        timeout-minutes: 40
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_FUREAI }}
          TEST_NOTIFICATION: ${{ inputs.test }}
          RESET_STATE: ${{ inputs.reset_state }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ] && [ "$RESET_STATE" = "true" ]; then
            echo "test と reset_state は併用できません" >&2
            exit 1
          elif [ "$TEST_NOTIFICATION" = "true" ]; then
            python fureai.py --test
          elif [ "$RESET_STATE" = "true" ]; then
            python fureai.py --reset-state
          else
            python fureai.py
          fi

      # 途中まで送信して後続で失敗した場合も、送信済みのチェックポイントを保存する。
      - name: Persist state
        if: ${{ always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') && inputs.test != true }}
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: bash scripts/persist_state.sh state_fureai.json "$STATE_BRANCH"

      - name: Upload state backup and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fureai-state-and-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state_fureai.json
            debug/
          if-no-files-found: ignore
          retention-days: 14
