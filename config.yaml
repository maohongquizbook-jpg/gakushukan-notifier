# Discord Webhook URL（GitHub Actionsで使う場合はここは空のままにし、Secretsに登録する）
discord_webhook_url: ""

# 「どこで」の選択値。1000_1650 = 生涯学習館（5館全部が1回の検索で取得される）
category_value: "1000_1650"

# 特定の館だけに絞りたい場合に館名を列挙（空なら全館対象）
# 例: facility_filter: [西戸山, 戸山]
facility_filter: []

# 通知条件: 同じ部屋・同じ日にここで指定した時間帯が「全部」空いていること
required_slots:
  - 午後
  - 夜間

# --loop（常駐モード）でのチェック間隔（分）
check_interval_min: 5

# 常駐モードの稼働時間帯 [開始時, 終了時)
active_hours: [7, 23]

# 何か月先まで検索するか（Nか月先の「月末」まで。予約枠の公開ルールに合わせて自動計算）
# 例: 3 なら 7月中は10/31まで、8月に入ると自動的に11/30までに広がる
horizon_months: 3

# 成立していた「午後＋夜間の連続空き」が予約されて埋まった時にも通知するか
notify_filled: false

# 通知量を抑える設定。必要な場合だけ @here に変更（分割通知でも最初の1通のみ）。
discord_mention: ""
# 一時的な表示欠落で満室→再空きにならないよう、2回の確認で空き終了を確定。
closed_confirmations: 2
# 初回・設定変更・72時間を超える停止後は、現在の空きを通知せず基準登録。
baseline_after_hours: 72
